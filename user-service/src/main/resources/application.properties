spring.application.name=user-service

# PostgreSQL local database
spring.datasource.url=jdbc:postgresql://127.0.0.1:5432/digitalwallet
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.port=8001

# JWT: set JWT_SECRET to a Base64-encoded key of at least 32 bytes outside local development.
app.jwt.secret=${JWT_SECRET:bG9jYWwtZGV2ZWxvcG1lbnQta2V5LW11c3QtYmUtcGxhY2VkLWluLWVudg==}
app.jwt.access-token-expiration-ms=${JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
app.jwt.refresh-token-expiration-ms=${JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
app.jwt.pin-max-failed-attempts=${PIN_MAX_FAILED_ATTEMPTS:5}
app.jwt.pin-lock-minutes=${PIN_LOCK_MINUTES:15}
